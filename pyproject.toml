[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "oprim"
version = "3.23.0"
description = "Atomic operations library — Layer 1 meta-primitives for financial analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Wiki" }]
dependencies = [
    "obase>=0.31.0",
    # 核心计算（轻量，所有环境必需）
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "statsmodels>=0.14.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-frontmatter>=1.0",
    "httpx>=0.27",
    "chardet>=5.0",
    "python-ulid>=3.0",
    "fsrs>=4.0.0",
    "psutil>=5.9",
    "python-magic>=0.4",
    "dnspython>=2.6",
    "trafilatura>=1.8.0",
    "readability-lxml>=0.8.1",
    "jinja2>=3.0",
    "paramiko>=5.0.0",
    "stripe>=11.0",
    "python-alipay-sdk>=3.3",
    # Oprim's MCP adapter targets the v1 FastMCP API.  MCP v2 renamed that
    # public surface, so keep the runtime contract explicit and reproducible.
    # origin/main raised the floor to 1.27 (FastMCP API additions it relies on),
    # so keep the tighter of the two lower bounds.
    "mcp>=1.27,<2",
]

[project.optional-dependencies]
pdf = [
    "pymupdf>=1.27",
    "pymupdf4llm>=0.3",
]
epub = [
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
]
storage = [
    "lancedb>=0.17",
    "tantivy>=0.22",
    "duckdb>=0.10",
]
llm = [
    "dashscope>=1.14",
]
image = [
    "Pillow>=10.0",
]
tts = [
    "vibevoice>=0.0.1",
    "edge-tts>=7.2",
]
cloud = [
    "boto3>=1.34",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "asyncpg>=0.29",
]
macro = [
    "akshare>=1.14",
]
math = [
    "sympy>=1.12",
]
hmm = [
    "hmmlearn>=0.3",
]
full = [
    "oprim[pdf,epub,storage,llm,image,tts,cloud,macro,math,hmm]",
]


dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.4.0",
    "respx>=0.23",
    "pytest-asyncio>=0.23",
    # optional-feature deps exercised by the test-suite
    "sympy>=1.12",
    "hmmlearn>=0.3",
    "boto3>=1.34",
    "websockets>=12.0",
    "psycopg[binary]>=3.1",
    "python-frontmatter>=1.0",
    "alembic>=1.13",
    "defusedxml>=0.7",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
# Targeted ignores (everything else in the selected families stays enforced):
# - N802/N803/N806/N812/N817: quant/math code deliberately uses notation names
#   (X, Sigma, T, N, K, bS_matrix, `import numpy.linalg as LA` ...).
# - E741: `l` is the conventional name for the OHLC "low" series.
# - E501: line length is left to the formatter (also off in ruff's default rule set).
# - B904: `raise ... from` chaining is a tracked follow-up, not a CI gate.
# - SIM108: if/else blocks are kept where they read better than a ternary (pricing maths).
# - UP042: `(str, Enum)` -> StrEnum changes str()/format() of members (behaviour change).
ignore = ["N802", "N803", "N806", "N812", "N817", "E741", "E501", "B904", "SIM108", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files are the public re-export surface (lazy map + explicit pins).
"__init__.py" = ["F401", "E402"]
# Tests: nested `with patch(...)` / `pytest.raises` blocks and small lambda fixtures are
# idiomatic; section-local imports in the batch test file are intentional.
"tests/**" = ["SIM117", "E731"]
"tests/test_batch_hevi_f11.py" = ["E402"]
# Edu kernels vendored byte-for-byte by Mneme (which pins platform main): keep them
# untouched here; fix together with Mneme so the vendored copies stay in sync.
"oprim/echo_loop.py" = ["I001", "UP045"]
"oprim/chemical_equation.py" = ["SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -v"
asyncio_mode = "auto"
markers = [
    "academic_reference: test verifies against published academic/RFC/FIPS reference vectors",
    "integration: requires live external service (GDrive OAuth, network) — skip by default",
]

[tool.coverage.run]
source = ["oprim"]
branch = true
omit = [
    "oprim/_base.py",
    "oprim/_validation.py",
]

[tool.coverage.report]
# Ratchet floor: the suite measured ~76.4% in a clean 3.12 env (Oct 2026) when CI was
# repaired; the historical 95% target was never enforced (CI was red). This is a
# ratchet — only ever raise it as tests land, never lower it.
fail_under = 76
show_missing = true

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["oprim._s3", "oprim._postgres", "oprim._system"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["psutil"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["alipay"]
ignore_missing_imports = true

[project.entry-points."obase.providers"]
qwen3_dashscope = "oprim.providers.dashscope:register"
qwen3 = "oprim.providers.qwen3:register"
